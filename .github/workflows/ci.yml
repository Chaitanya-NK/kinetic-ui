name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:packages
      - run: npm run registry
      - run: npm run typecheck
      - run: npm run test:unit
      - name: Figma plugin is built from the current tokens and icons
        run: npm run test:figma && git diff --exit-code -- figma/code.js figma/src/data.generated.ts
      - run: npm run build -w docs

  # Accessibility (axe, WCAG 2.1 AA) and visual snapshots of every demo, block and template.
  # Runs in Playwright's own image so screenshots match the committed baselines pixel for pixel.
  e2e:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - run: npm run build:packages
      - run: npm run registry
      - run: npm run build -w docs
      - name: Accessibility
        run: npx playwright test --project=a11y
      - name: Visual snapshots
        if: ${{ !cancelled() }}
        run: npx playwright test --project=visual
      - uses: actions/upload-artifact@v4
        if: ${{ failure() }}
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
